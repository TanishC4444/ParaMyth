name: Tiger accounts and teams
on:
  push:
    paths: ['paramyth/studio/**', 'paramyth/pipeline/api/**', 'tests/test_studios.py', 'tests/test_advanced_studios.py', 'tests/test_legacy_migration.py', 'tests/test_studio_serve.py', 'tests/test_account_workspaces.py', 'pyproject.toml', '.github/workflows/tiger.yml', 'tests/test_tiger_db.py']
  pull_request:
    paths: ['paramyth/studio/**', 'paramyth/pipeline/api/**', 'tests/test_studios.py', 'tests/test_advanced_studios.py', 'tests/test_legacy_migration.py', 'tests/test_studio_serve.py', 'tests/test_account_workspaces.py', 'pyproject.toml', '.github/workflows/tiger.yml', 'tests/test_tiger_db.py']
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: studio_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PARAMYTH_DB_LOCAL_TEST: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[studio,tiger,api,rag,docx,hosted,test]'
      - name: Test legacy cutover on empty disposable database
        env:
          PARAMYTH_MIGRATION_TEST_DATABASE_URL: postgresql://postgres:local-ci-only@localhost:5432/studio_test
        run: python -m unittest discover -s tests -p test_legacy_migration.py -v
      - name: Migrate isolated database
        env:
          PARAMYTH_MIGRATION_DATABASE_URL: postgresql://postgres:local-ci-only@localhost:5432/studio_test
        run: |
          python -m paramyth.studio.studio_db
          python -m paramyth.studio.studio_db
          python - <<'PY'
          import os, psycopg
          with psycopg.connect(os.environ['PARAMYTH_MIGRATION_DATABASE_URL']) as conn:
              conn.execute("CREATE ROLE studio_ci LOGIN PASSWORD 'local-app-only'")
              conn.execute('GRANT USAGE ON SCHEMA paramyth TO studio_ci')
              conn.execute('GRANT SELECT, INSERT, UPDATE, DELETE ON paramyth.users, paramyth.sessions, paramyth.auth_limits, paramyth.studios, paramyth.memberships, paramyth.invitations, paramyth.projects, paramyth.project_revisions, paramyth.comments TO studio_ci')
          PY
      - name: Test accounts, authorization and concurrent edits
        env:
          PARAMYTH_TEST_DATABASE_URL: postgresql://studio_ci:local-app-only@localhost:5432/studio_test
        run: |
          python -m unittest discover -s tests -p test_studios.py -v
          python -m unittest discover -s tests -p test_advanced_studios.py -v
          python -m unittest discover -s tests -p test_account_workspaces.py -v
      - run: python -m unittest discover -s tests -p test_tiger_db.py -v
      - run: python -m unittest discover -s tests -p test_studio_serve.py -v
