name: Backend tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install complete backend test dependencies
        run: python -m pip install -e '.[test,api,rag,tiger,production,studio,hosted]'
      - name: Run all backend regressions
        run: python -m unittest discover -s tests -v
