name: Image backend
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -p 'test_images.py' -v
