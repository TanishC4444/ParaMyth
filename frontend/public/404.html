<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#081216" />
    <meta name="robots" content="noindex" />
    <title>Page not found · ParaMyth</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // The app routes with hashes. Send "/atlas"-style paths to "/#/atlas" instead of a dead end.
      (function () {
        var views = ["atlas", "overview", "projects", "workflow", "runs", "retrieval", "library", "connections"];
        var first = location.pathname.replace(/^\/+|\/+$/g, "").split("/")[0];
        if (views.indexOf(first) !== -1) location.replace("/#/" + first);
      })();
    </script>
    <style>
      html,body{margin:0;min-height:100%;background:#081216;color:#f5eedb}
      body{font:16px/1.7 "Instrument Sans",Manrope,system-ui,sans-serif;background:radial-gradient(1200px 700px at 85% -10%,rgba(95,156,136,.16),transparent 60%),radial-gradient(900px 600px at -10% 110%,rgba(212,170,92,.10),transparent 60%),#081216;min-height:100vh}
      header{padding:26px 40px}
      .mark{display:inline-flex;align-items:center;gap:10px;color:#f5eedb;text-decoration:none;font:400 27px/1 Georgia,"Times New Roman",serif}
      .mark svg{width:34px;height:34px}
      main{max-width:820px;margin:0 auto;padding:12vh 28px 110px}
      .kicker{margin:0 0 22px;color:#d4aa5c;font:600 11px/1 system-ui,sans-serif;letter-spacing:.32em;text-transform:uppercase}
      h1{font:300 clamp(42px,7vw,88px)/.98 Georgia,serif;letter-spacing:-.035em;margin:0 0 28px}
      h1 em{font-style:italic;color:#f1d48e;font-weight:400}
      p.lede{max-width:560px;color:#c8d5c4;margin:0 0 44px}
      code{font:13px ui-monospace,Menlo,monospace;color:#f1d48e;background:#10252b;padding:3px 7px;overflow-wrap:anywhere}
      .actions{display:flex;flex-wrap:wrap;gap:14px 18px}
      .actions a{display:inline-flex;align-items:center;gap:12px;padding:14px 22px;font:600 11px/1 system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;text-decoration:none}
      .primary{color:#081216;background:#d4aa5c}.primary:hover{background:#f1d48e}
      .ghost{color:#f1d48e;border:1px solid rgba(212,170,92,.5)}.ghost:hover{color:#081216;background:#d4aa5c}
      @media(max-width:600px){header{padding:20px}main{padding:8vh 20px 80px}}
    </style>
  </head>
  <body>
    <header>
      <a class="mark" href="/" aria-label="ParaMyth home">
        <svg viewBox="0 0 64 64" fill="none" stroke="#f1d48e" stroke-width="2" aria-hidden="true"><circle cx="32" cy="32" r="24"/><path d="M32 12.5 35.6 28.4 51.5 32 35.6 35.6 32 51.5 28.4 35.6 12.5 32 28.4 28.4Z" fill="#d4aa5c" fill-opacity=".3"/></svg>
        ParaMyth
      </a>
    </header>
    <main>
      <p class="kicker">404 · Page not found</p>
      <h1>This chapter <em>isn't written</em> yet.</h1>
      <p class="lede">There is no page at <code id="path"></code>. It may have moved, or the link may be mistyped.</p>
      <div class="actions">
        <a class="primary" href="/">Back to the beginning →</a>
        <a class="ghost" href="/#/atlas">Open the story atlas</a>
      </div>
    </main>
    <script>document.getElementById("path").textContent = location.pathname;</script>
  </body>
</html>
