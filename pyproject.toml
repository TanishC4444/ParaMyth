[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paramyth"
version = "0.1.0"
description = "File-backed storytelling backend foundations"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
rag = ["numpy>=2,<3", "python-dotenv>=1,<2"]
production = ["tzdata>=2024.1"]
test = ["PyYAML==6.0.2"]
docx = ["python-docx>=1.1,<2"]
api = ["PyYAML==6.0.2", "fastapi>=0.121,<1", "uvicorn[standard]>=0.30,<1", "httpx>=0.27,<1"]
studio = ["fastapi>=0.121,<1", "uvicorn[standard]>=0.30,<1", "httpx>=0.27,<1", "tzdata>=2024.1"]
tiger = ["psycopg[binary]>=3.2,<4", "certifi>=2024.2"]
hosted = ["cryptography>=44,<47"]

[project.scripts]
paramyth-pipeline = "paramyth.pipeline.cli:main"
paramyth-pipeline-studio = "paramyth.pipeline.studio:main"
paramyth-pipeline-production = "paramyth.pipeline.production_web:main"
paramyth-creative = "paramyth.creative:main"
paramyth-images = "paramyth.image_studio:main"
paramyth-production = "paramyth.production:main"
paramyth-production-export = "paramyth.production_exports:main"
paramyth-rag-ingest = "paramyth.rag.ingest:main"
paramyth-rag-search = "paramyth.rag.search:main"
paramyth-soundtracks = "paramyth.soundtracks:main"
paramyth-studio = "paramyth.studio.serve:main"

[tool.setuptools.packages.find]
include = ["paramyth*"]

[tool.setuptools.package-data]
"paramyth.studio" = ["migrations/*.sql"]
"paramyth.pipeline" = ["production_ui.html", "image_ui.html", "studio_ui.html"]
"paramyth.pipeline.api" = ["demo_data/**/*"]
